<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Chat de Filmes</title>
</head>

<body>

    <div class="caixa-principal">
        <h1>🎬 Chat de Filmes</h1>

        <p class="introducao">
            Responda às perguntas e descubra um filme que combina com você!
        </p>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">
            <h2 class="titulo-resultado"></h2>
            <p class="texto-resultado"></p>
            <button class="botao-reiniciar" onclick="reiniciar()">🔄 Escolher outro filme</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
